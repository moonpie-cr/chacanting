* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "FusionPixel", "Courier New", monospace;
  font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: none; -moz-osx-font-smoothing: grayscale;
}
button, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 3px dashed var(--red); outline-offset: 3px; }

/* ===== 像素組件 ===== */
.px {
  background: var(--surface);
  box-shadow: 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink),
              4px 8px 0 0 var(--shadow), 8px 4px 0 0 var(--shadow);
}
.btn {
  border: 0; padding: 8px 14px; min-height: 40px; background: var(--yellow); color: var(--ink);
  box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink), 3px 6px 0 0 var(--shadow);
}
.btn:active { transform: translate(3px, 3px); box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink); }
.btn.red { background: var(--red); color: var(--on-accent); }
.btn.green { background: var(--green); color: var(--on-accent); }

}

/* ===== 頂欄 ===== */
.topbar {

}

/* ===== 畫面 ===== */
.screen { min-height: 100vh; min-height: 100dvh; }

/* --- 開場 --- */
#scr-splash { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 70px 16px 40px; position: relative; overflow: hidden; text-align: center; }

.logo { display: inline-block; padding: 18px 28px 14px; background: var(--red); color: var(--on-accent); }
.logo .zh { font-size: 48px; line-height: 1.1; letter-spacing: 6px; color: var(--yellow); text-shadow: 4px 0 0 var(--ink), 0 4px 0 var(--ink), 4px 4px 0 var(--ink); }

.tagline { padding: 8px 14px; font-size: 16px; }
.parade { display: flex; gap: 14px; }

.parade canvas:nth-child(2n) { animation-delay: .3s; }
@keyframes hop { 50% { transform: translateY(-6px); } }
.splash-lang { padding: 14px 16px 16px; }
.splash-lang .lbl { font-size: 12px; color: var(--text-2); margin-bottom: 10px; letter-spacing: 2px; }
.splash-lang .seg { justify-content: center; }
.start { font-size: 24px; padding: 12px 34px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: .55; } }
.splash-tip { font-size: 12px; color: var(--text-2); }

/* --- 場景舞台（街景 / 店內共用） --- */
.scene-wrap { position: relative; width: 100%; overflow: hidden; background: var(--ink); }
.stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; container-type: inline-size; transform-origin: 52% 66%; }
.stage canvas { width: 100%; height: 100%; }
.ov { position: absolute; left: calc(var(--x) / var(--sw) * 100%); top: calc(var(--y) / var(--sh) * 100%);
      width: calc(var(--w) / var(--sw) * 100%); height: calc(var(--h) / var(--sh) * 100%); }

/* --- 街景 --- */
#scr-street { display: flex; flex-direction: column; background: var(--ink); }
#scr-street .scene-wrap { width: min(100%, calc((100vh - 64px) * 16 / 9)); width: min(100%, calc((100dvh - 64px) * 16 / 9)); aspect-ratio: 16 / 9; margin: auto; }
@media (max-aspect-ratio: 1/1) {
  #scr-street .scene-wrap { width: 100%; aspect-ratio: 4 / 3; margin-top: 64px; }
  #streetStage { width: 133.34%; left: -16.67%; }
}
#streetStage { --sw: 256; --sh: 144; }
.signboard { display: flex; align-items: center; justify-content: center; gap: 1.2cqw; color: var(--yellow);
  font-size: 3.6cqw; letter-spacing: .6cqw; line-height: 1; text-shadow: .35cqw .35cqw 0 var(--ink); pointer-events: none; white-space: nowrap; }

  pointer-events: none; text-shadow: 0 0 var(--neon-blur) currentColor, 0 0 calc(var(--neon-blur) * 2) currentColor; }
.vneon.pink { color: var(--neon-pink); animation: flicker 4s steps(1) infinite; }
.vneon.cyan { color: var(--neon-cyan); }
.vneon.yellow { color: var(--neon-yellow); animation: flicker 6s steps(1) infinite 1s; }
.hneon { display: flex; align-items: center; justify-content: center; font-size: 2cqw; line-height: 1; pointer-events: none; color: var(--neon-green);
  text-shadow: 0 0 var(--neon-blur) currentColor; letter-spacing: .3cqw; }
@keyframes flicker { 0%,90%,100% { opacity: 1 } 91% { opacity: .25 } 93% { opacity: 1 } 95% { opacity: .35 } }
.hotspot { border: 0; background: transparent; padding: 0; cursor: pointer; }
.hotspot:hover, .hotspot:focus-visible { outline: .5cqw dashed var(--yellow); outline-offset: .3cqw; }
.door-arrow { pointer-events: none; display: flex; justify-content: center; align-items: flex-start; font-size: 3cqw; color: var(--yellow);
  text-shadow: .3cqw .3cqw 0 var(--ink); animation: hop 0.8s steps(2) infinite; }
.enter-bubble { pointer-events: none; display: flex; align-items: center; justify-content: center; white-space: nowrap;
  font-size: 1.8cqw; background: var(--surface); color: var(--text); box-shadow: 0 0 0 .4cqw var(--ink); opacity: 0; transition: opacity .1s steps(1); }
.hotspot:hover ~ .enter-bubble, .hotspot:focus-visible ~ .enter-bubble, .enter-bubble.show { opacity: 1; }
.street-hint { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 16px;
  background: var(--surface); color: var(--text); border-top: 4px solid var(--shadow); font-size: 15px; text-align: center; min-height: 64px; }
.street-hint .addr { color: var(--text-2); font-size: 12px; }

/* --- 店內 --- */
#scr-shop { padding-top: 60px; }
#shopWrap { aspect-ratio: 256 / 96; max-width: 1180px; margin: 0 auto; box-shadow: 0 4px 0 0 var(--ink); }
#shopStage { --sw: 256; --sh: 96; }
.strip { display: flex; align-items: flex-start; justify-content: center; writing-mode: vertical-rl; font-size: 1.55cqw; line-height: 1;
  color: var(--ink); padding-top: .4cqw; letter-spacing: .15cqw; box-shadow: 0 0 0 .25cqw var(--ink); pointer-events: none; overflow: hidden; }
.strip b { font-weight: normal; color: var(--red); }
.strip.c1 { background: var(--px-w); } .strip.c2 { background: var(--px-e); } .strip.c3 { background: var(--px-p); } .strip.c4 { background: var(--green-soft); color: var(--ink); }
.pboard { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--px-w); font-size: 1.3cqw; line-height: 1.25; text-align: center; pointer-events: none; }
.pboard b { font-weight: normal; color: var(--px-e); font-size: 1.7cqw; }
.bubble { display: flex; align-items: center; justify-content: center; text-align: center; padding: .6cqw 1cqw;
  background: var(--px-w); color: var(--px-k); font-size: clamp(11px, 1.9cqw, 20px); line-height: 1.3; box-shadow: 0 0 0 .4cqw var(--px-k);
  pointer-events: none; }
.bubble::after { content: ""; position: absolute; left: 62%; bottom: -1.6cqw; width: 1.4cqw; height: 1.4cqw; background: var(--px-w);
  box-shadow: .4cqw 0 0 var(--px-k), 0 .4cqw 0 var(--px-k); }
.bubble.pop { animation: pop .25s steps(3); }

main.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 140px; display: grid; grid-template-columns: 1fr; gap: 28px; }
@media (min-width: 900px) {
  main.wrap { grid-template-columns: 1fr 350px; align-items: start; padding-bottom: 60px; }

  .bottombar, #sheetMask, .sheet-close { display: none !important; }
}
.nowline { margin: 0 4px 16px; font-size: 14px; color: var(--text-2); }

.cats { display: flex; flex-wrap: wrap; gap: 12px; margin: 4px 4px 22px; }
.cat { border: 0; min-height: 40px; padding: 6px 12px; background: var(--surface-2);
  box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink); }
.cat.on { background: var(--green); color: var(--on-accent); }
.sec-title { margin: 0 4px 12px; font-size: 20px; font-weight: normal; color: var(--green); }
.sec-title::before { content: "▶ "; color: var(--red); }

.item.off .btn { background: var(--surface); color: var(--text-2); }
.stamp { position: absolute; top: 40px; left: 50%; transform: translateX(-50%) rotate(-12deg); padding: 2px 8px; font-size: 14px;
  color: var(--red); box-shadow: 0 0 0 3px var(--red); background: var(--surface); pointer-events: none; white-space: nowrap; }
.tag { position: absolute; top: -10px; left: -6px; padding: 1px 6px; font-size: 12px; background: var(--red); color: var(--on-accent); box-shadow: 0 0 0 2px var(--ink); }
.qtybadge { position: absolute; top: -10px; right: -8px; min-width: 26px; padding: 1px 6px; font-size: 12px; background: var(--yellow); color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }

/* 落單紙 */
aside.cart { padding: 16px; }
.cart-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }

label.lb { font-size: 13px; color: var(--text-2); display: block; margin: 10px 0 6px; }
select.field, textarea { width: 100%; color: var(--text); background: var(--surface-2); border: 0; padding: 8px; box-shadow: 0 0 0 3px var(--ink); min-height: 40px; }

/* 手機底部欄 + 抽屜 */
@media (max-width: 899px) {

}

#hallWrap, #boothWrap { aspect-ratio: 16 / 9; width: min(100%, calc((100dvh - 150px) * 16 / 9)); min-width: min(100%, 520px); margin: 0 auto; box-shadow: 0 4px 0 0 var(--ink); }
#hallStage, #boothStage { --sw: 256; --sh: 144; }

  display: flex; flex-direction: column; align-items: center; justify-content: flex-end; cursor: pointer; }

<!-- 1. 開場 -->
<section class="screen" id="scr-splash">

function tone(seq, type = "square", vol = 0.06) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    let tt = actx.currentTime;
    seq.forEach(([f, d, gap]) => {
      if (f) {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(vol, tt); g.gain.exponentialRampToValueAtTime(0.001, tt + d);
        o.connect(g).connect(actx.destination); o.start(tt); o.stop(tt + d);
      }
      tt += gap ?? d * 0.9;
    });
  } catch (e) {}
}

const modalStack = [];
function openModal(mask, onClose) {
  modalStack.push({ mask, onClose, back: document.activeElement });
  mask.classList.add("show");
  const f = mask.querySelector("[data-autofocus]") || mask.querySelector("button, select, textarea");
  setTimeout(() => f && f.focus(), 30);
}
function closeModal(mask) {
  const i = modalStack.findIndex(m => m.mask === mask); if (i < 0) return;
  const [m] = modalStack.splice(i, 1);
  mask.classList.remove("show");
  m.onClose && m.onClose();
  if (m.back && m.back.focus) m.back.focus();
}
document.addEventListener("keydown", e => {
  const top = modalStack[modalStack.length - 1]; if (!top) return;
  if (e.key === "Escape") { e.preventDefault(); closeModal(top.mask); return; }
  if (e.key === "Tab") {
    const box = top.mask.id === "sheetMask" ? $("#cart") : top.mask;
    const els = [...box.querySelectorAll("button:not([disabled]), select, textarea, [tabindex]")].filter(x => x.offsetParent !== null);
    if (!els.length) return;
    const first = els[0], last = els[els.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

function fly(card, id) {

  const desk = matchMedia("(min-width: 900px)").matches;
  const target = desk ? $("#cartTitle") : $("#barSum");

/* ================= 場景繪製 ================= */
let S = {};
function loadScenePal() {
  const names = ["sky1","sky2","sky3","star","cloud","far","far-win","bld-a","bld-a-d","bld-b","bld-b-d","bld-c","bld-c-d","win","win-lit","ac",
    "cloth1","cloth2","cloth3","sign","awn1","awn2","tile","tile-d","glow","glow-d","walk","walk-d","curb","road","road-d","yline","lane","lamp",
    "lamp-glow","wood","wood-d","board","silh","neon-box","taxi","taxi-roof","bus","bus-top","pharm",
    "in-ceil","in-wall","in-wall-d","in-tile","in-tile-d","in-floor","in-floor-d","neon-pink","in-booth","in-booth-d","in-top","in-glass","in-lamp","in-fan","in-shirt"];
  S = {}; names.forEach(n => S[n] = cssVar("--" + n));
  S.night = cssVar("--neon-blur") !== "0px";
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const R = (ctx, x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); };
function dither(ctx, x, y, w, h, c, phase = 0) { ctx.fillStyle = c; for (let j = 0; j < h; j++) for (let i = (j + phase) % 2; i < w; i += 2) ctx.fillRect(x + i, y + j, 1, 1); }

// 窗燈（固定隨機 + 夜晚偶爾開關）
const winSeed = rng(88); const WIN_STATE = Array.from({ length: 300 }, () => winSeed());
let STARS = (() => { const r = rng(7); return Array.from({ length: 40 }, () => [Math.floor(r() * 256), Math.floor(r() * 50), r()]); })();

function drawWindows(ctx, x0, y0, cols, rows, gx, gy, w, h, seedOff, f, withAC) {
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const idx = (seedOff + r * cols + c) % WIN_STATE.length;
    let lit = S.night ? WIN_STATE[idx] > 0.42 : WIN_STATE[idx] > 0.92;
    if (S.night && WIN_STATE[idx] > 0.97 && Math.floor(f / 60 + idx) % 3 === 0) lit = !lit;
    const x = x0 + c * gx, y = y0 + r * gy;
    R(ctx, x - 1, y - 1, w + 2, h + 2, S["bld-a-d"]);
    R(ctx, x, y, w, h, lit ? S["win-lit"] : S.win);
    R(ctx, x + (w >> 1), y, 1, h, S["bld-a-d"]);
    if (!lit) R(ctx, x + 1, y + 1, 1, 2, S.ac);
    if (withAC && WIN_STATE[(idx + 31) % 300] > 0.55) { R(ctx, x, y + h + 2, w, 3, S.ac); R(ctx, x + 1, y + h + 3, w - 2, 1, S["bld-a-d"]); }
  }
}
function laundry(ctx, x, y, len, f) {
  R(ctx, x, y, len, 1, S.wood);
  if (typeof sceneId !== "undefined" && sceneId === "typhoon") return;
  if (typeof clothFlap !== "undefined" && clothFlap > 0) {
    const cs = [S.cloth1, S.cloth2, S.cloth3, S.ac];
    for (let i = 0; i < len / 6; i++) { const fl = (Math.floor(f / 2) + i) % 2; R(ctx, x + 2 + i * 6, y + 1 + fl, 7, 2 + (1 - fl), cs[i % 4]); }
    return;
  }
  const cols = [S.cloth1, S.cloth2, S.cloth3, S.ac];
  for (let i = 0; i < len / 6; i++) {
    const sway = (Math.floor(f / 8) + i) % 2;
    R(ctx, x + 2 + i * 6 + sway, y + 1, 4, 5 + (i % 2) * 2, cols[i % 4]);
  }
}
function drawStreet(ctx, f) {
  // 天空
  R(ctx, 0, 0, 256, 22, S.sky1); R(ctx, 0, 22, 256, 22, S.sky2); R(ctx, 0, 44, 256, 40, S.sky3);
  dither(ctx, 0, 21, 256, 2, S.sky2); dither(ctx, 0, 43, 256, 2, S.sky3, 1);
  if (S.night) {
    STARS.forEach(([x, y, p]) => { if ((Math.floor(f / 10) + Math.floor(p * 10)) % 7) R(ctx, x, y, 1, 1, S.star); });
    R(ctx, 214, 8, 8, 8, S.star); R(ctx, 213, 9, 1, 6, S.star); R(ctx, 222, 9, 1, 6, S.star); R(ctx, 216, 9, 3, 3, S.sky2);
  } else {
    [[30, 10, 30], [140, 6, 40], [210, 16, 26]].forEach(([x, y, w], i) => {
      const xx = ((x + f * 0.05 * (i + 1)) % 300) - 30;
      R(ctx, xx, y, w, 5, S.cloud); R(ctx, xx + 5, y - 3, w - 12, 3, S.cloud); R(ctx, xx + 10, y - 5, 8, 2, S.cloud);
    });
  }
  if (typeof sceneId !== "undefined" && sceneId === "midautumn") { circle(ctx, 120, 12, 8, S.moon); R(ctx, 116, 9, 3, 3, S.moonDark); R(ctx, 122, 14, 2, 2, S.moonDark); R(ctx, 121, 7, 2, 2, S.moonDark); }
  if (typeof sceneId !== "undefined" && (sceneId === "rain" || sceneId === "typhoon")) { R(ctx, 0, 0, 256, 84, S.skyRain2); dither(ctx, 0, 20, 256, 64, S.skyRain); for (let i = 0; i < 6; i++) { const x = ((i * 53 + f * 0.1) % 300) - 30; R(ctx, x, 6 + (i % 3) * 8, 40, 6, S.skyRain); } }
  // 遠景樓群
  const far = [[0, 16, 58], [14, 14, 70], [26, 20, 50], [44, 12, 76], [54, 18, 60], [70, 14, 66], [82, 22, 54], [102, 12, 80], [112, 18, 62],
               [128, 16, 72], [142, 20, 56], [160, 12, 78], [170, 18, 64], [186, 14, 70], [198, 20, 52], [216, 16, 74], [230, 12, 60], [240, 16, 68]];
  far.forEach(([x, w, h], i) => {

function iris(x, y, close, ms = 450) {
  return new Promise(res => {
    const el = $("#iris");
    if (reduceMotion) { el.classList.toggle("on", close); el.style.width = el.style.height = close ? "0px" : "300vmax"; res(); if (!close) el.classList.remove("on"); return; }
    el.style.left = x + "px"; el.style.top = y + "px"; el.classList.add("on");
    const big = Math.hypot(innerWidth, innerHeight) * 2.2 + "px";
    const a = el.animate(close ? [{ width: big, height: big }, { width: "0px", height: "0px" }] : [{ width: "0px", height: "0px" }, { width: big, height: big }],
      { duration: ms, easing: "steps(8)", fill: "forwards" });
    a.onfinish = () => { if (!close) { el.classList.remove("on"); a.cancel(); } res(); };
  });
}
async function go(name, x = innerWidth / 2, y = innerHeight / 2) {
  await iris(x, y, true);

}

/* ---------- 音效（環境音） ---------- */
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
let noiseBuf = null;
function getNoise(c) {
  if (!noiseBuf) {
    noiseBuf = c.createBuffer(1, c.sampleRate * 3, c.sampleRate);
    const d = noiseBuf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < d.length; i++) { const wn = Math.random() * 2 - 1; last = (last + 0.02 * wn) / 1.02; d[i] = last * 3.2 + wn * 0.15; }
  }
  return noiseBuf;
}
const ambNodes = { street: null, shop: null };
function startAmb(kind) {
  if (!amb[kind] || !soundOn) return;
  const c = ac(); if (!c) return;
  stopAmb(kind);
  const src = c.createBufferSource(); src.buffer = getNoise(c); src.loop = true;
  const flt = c.createBiquadFilter(); const g = c.createGain();
  if (kind === "street") { flt.type = "lowpass"; flt.frequency.value = 520; g.gain.value = 0.05; }
  else { flt.type = "bandpass"; flt.frequency.value = 900; flt.Q.value = 0.7; g.gain.value = 0.028; }
  src.connect(flt).connect(g).connect(c.destination); src.start();
  ambNodes[kind] = { src, g, flt };
  // 隨機生活音
  const timer = setInterval(() => {
    if (!amb[kind] || !soundOn) return;
    if (kind === "street" && Math.random() < 0.5) tone([[220, .25, .3]], "sawtooth", 0.012);
    if (kind === "shop" && Math.random() < 0.7) tone([[1600 + Math.random() * 900, .03, .06]], "square", 0.018);
  }, kind === "street" ? 2600 : 1900);
  ambNodes[kind].timer = timer;
  if (kind === "shop") { radioTimer = setInterval(radioPhrase, 13000); setTimeout(radioPhrase, 1200); }
}
function stopAmb(kind) {
  const n = ambNodes[kind]; if (!n) return;
  clearInterval(n.timer); if (kind === "shop" && radioTimer) { clearInterval(radioTimer); radioTimer = null; }
  try { n.g.gain.setTargetAtTime(0, actx.currentTime, 0.2); setTimeout(() => { try { n.src.stop(); } catch (e) {} }, 400); } catch (e) {}
  ambNodes[kind] = null;
}
let radioTimer = null;
const RADIO = [[523, 1], [659, 1], [784, 1], [659, 1], [587, 1], [698, 1], [880, 1], [784, 1], [523, .5], [587, .5], [659, 2], [0, 1]];
function radioPhrase() {
  if (!amb.shop || !soundOn) return;
  const c = ac(); if (!c) return;
  let t0 = c.currentTime + 0.05;
  RADIO.forEach(([f, b]) => {
    if (f) {
      const o = c.createOscillator(), g = c.createGain();
      o.type = "square"; o.frequency.value = f;
      g.gain.setValueAtTime(0.014, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5 * b);
      o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + 0.5 * b + 0.02);
    }
    t0 += 0.42 * b;
  });
}

    <table>${paid.items.map(x => `<tr><td>${esc(nm(byId(x.id)))} ×${x.qty}</td><td>${money(x.unit * x.qty)}</td></tr>`).join("")}</table>
    ${paid.discount ? `<div style="text-align:right;font-size:13px;color:var(--green)">${t("useCoupon", { v: paid.discount })}</div>` : ""}
    <div class="ticket-line"></div>
    <div class="total"><span>${t("total")}</span><b>${money(total)}</b></div>
    <div class="call">✓ ${esc(t("thanks"))}<br><span style="font-size:13px">${esc(t("gotCoupon"))}</span></div>
    <div class="actions" style="justify-content:center"><button class="btn green" data-autofocus id="thanksOk">OK</button></div></div>`;
  openModal($("#rcptMask"));
  $("#thanksOk").onclick = () => {
    closeModal($("#rcptMask"));
    currentOrder = null; seatTaken = {}; seatId = null; store.set("cct_order", "");
    renderBoothPanel(); go("street"); say(t("thanks")); if (voiceOn) speak(t("thanks"));
  };
};
$("#recMask").addEventListener("click", e => { if (e.target.id === "recMask") closeModal($("#recMask")); });
function extraTick() { tickEvent(); tickGuests(); }
/* 在卡座裡加單：直接加入枱上的單 */
const _addToCart = addToCart;
addToCart = function (m, o, extra, card) {
  if (screen === "booth" && currentOrder) {
    currentOrder.items.push({ id: m.id, o, unit: m.price + extra, qty: 1, done: false, at: 0 });
    currentOrder.total += m.price + extra; saveOrder(); renderBoothPanel(); startServing();
    SFX.add(); toast(t("recPicked", { n: nm(m) }));
    return;
  }
  _addToCart(m, o, extra, card);
};

/* ================= 啟動 ================= */
loadPal(); loadScenePal();
["mt", "pb", "et", "lt", "bp", "sh"].forEach(id => $("#parade").appendChild(spriteEl(id)));
applyLang(); show("splash");
{ const fb = $("#festBanner"); fb.hidden = !FEST[sceneId]; fb.textContent = FEST[sceneId] || ""; fb.className = "ov festbanner " + (sceneId === "typhoon" ? "bad" : ""); }
// 每分鐘刷新時段（自動模式）
setInterval(() => { if (periodOverride === "auto" && screen === "shop") { renderNow(); renderMenu(); renderCart(); } }, 60000);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawActive);
requestAnimationFrame(loop);
